:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2a3a;--mu:#5b6b7c;--bd:#d6dee8;--pr:#0a7e8c;--ok:#1a8f4a;--bad:#c0392b;--hl:#e6f6f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

header{background:linear-gradient(120deg,#0a7e8c,#2b5fd9 55%,#7b3fe4);color:#fff;padding:20px 16px;text-align:center}

table{border-collapse:collapse;margin-top:8px;max-width:100%}th,td{border:1px solid var(--bd);padding:5px 10px;text-align:left}th{background:var(--card)}

footer{text-align:center;color:var(--mu);font-size:.85rem;padding:18px 10px}.hide{display:none!important}.scroll{overflow-x:auto}

['Sedang','C3','Homeostasis',T([['Kondisi','Volume urine/hari','Warna urine'],['Cuaca panas, minum sedikit','0,5 L','Kuning pekat'],['Cuaca sejuk, minum banyak','2 L','Bening']]),'Data tersebut menunjukkan bahwa ginjal berperan dalam ...',['membentuk sel darah merah','mencerna lemak','menghasilkan insulin','mengatur keseimbangan kadar air tubuh'],3,0],

['Mudah','C2','Reproduksi Wanita','Seorang ibu menjelaskan bahwa pertemuan sel telur dan sperma terjadi di saluran yang menghubungkan ovarium dengan rahim.','Tempat terjadinya fertilisasi adalah ...',['Rahim (uterus)','Vagina','Tuba falopi (oviduk)','Serviks'],2,0],

['Sulit','C4','Siklus Menstruasi','Ibu Ani hamil dan selama masa kehamilan tidak mengalami menstruasi. Dokter menjelaskan bahwa kadar progesteron selama kehamilan tetap tinggi.','Penjelasan yang tepat mengapa tidak terjadi menstruasi adalah ...',['Progesteron tetap tinggi sehingga dinding rahim dipertahankan','Progesteron turun sehingga dinding rahim menebal','Estrogen berhenti diproduksi sama sekali','LH meningkat setiap hari'],0,0],

const L='ABCD',DUR=5400,PTS=100/Q.length;

 app.innerHTML=`<div class="card"><div class="tabs"><button class="${mode=='siswa'?'':'sec'}" onclick="login('siswa')">Mode Siswa</button><button class="${mode=='guru'?'':'sec'}" onclick="login('guru')">Mode Guru</button></div>`+

 if(!n||!p||!k)return login('siswa','Nama, nomor presensi, dan kelas wajib diisi.');
 google.script.run.withSuccessHandler(ok=>{if(!ok)return login('siswa','PIN salah. Tanyakan PIN kepada guru.');U={n,p,k};startQuiz()})
  .withFailureHandler(e=>login('siswa','Gagal terhubung ke server: '+e.message)).cekPin(pin)}

 google.script.run.withSuccessHandler(ok=>{if(!ok)return login('guru','Username atau password salah.');G={u,p};panel()})
  .withFailureHandler(e=>login('guru','Gagal terhubung ke server: '+e.message)).loginGuru(u,p)}

 clearInterval(tid);tid=setInterval(()=>{left--;tick();if(left<=0)finish()},1000);tick();render()}

 const q=Q[cur],a=A[cur]||{},lock=false,need=q[7]&&(a.w||'').trim().length<8;
